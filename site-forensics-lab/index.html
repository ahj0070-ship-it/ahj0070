<title>현장 포렌식 랩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single lab monitor. Main analysis viewport on the left, analyst briefing rail on the right,
   case steps along the bottom. Deliberately dark, single-theme: blueprint navy + hi-vis safety amber. */
:root{
  color-scheme: dark;
  --ink:#060c17;          /* room / page ground */
  --panel:#0a1322;        /* monitor glass */
  --panel-2:#0e1a2e;      /* raised surfaces */
  --line:#1a2a45;         /* hairlines */
  --line-2:#26395c;
  --fg:#dbe5f4;
  --muted:#7d8fae;
  --dim:#4a5b7a;
  --cyan:#5cd0ff;         /* measured data / scanner */
  --cyan-soft:rgba(92,208,255,.14);
  --amber:#ffb340;        /* hi-vis: deviation, the thing to look at */
  --amber-soft:rgba(255,179,64,.14);
  --red:#ff5d63;
  --red-soft:rgba(255,93,99,.14);
  --green:#46d3a0;
  --green-soft:rgba(70,211,160,.13);
  --f-display:"Chakra Petch","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(120% 80% at 70% -10%, rgba(40,80,150,.22), transparent 60%),
    linear-gradient(rgba(92,208,255,.035) 1px, transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg, rgba(92,208,255,.035) 1px, transparent 1px) 0 0/32px 32px,
    var(--ink);
  color:var(--fg);
  font-family:var(--f-body);
  font-size:14px;
  line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.app{height:100%;max-width:1640px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:4px 2px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;font-size:15px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.06em}
.case{display:flex;gap:18px;flex-wrap:wrap;padding-left:18px;border-left:1px solid var(--line-2);min-width:0}
.case div{display:flex;flex-direction:column;min-width:0}
.case .k{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.case .v{font-size:13px;font-weight:500;white-space:nowrap}
.top-right{display:flex;align-items:center;gap:16px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.live{display:flex;align-items:center;gap:8px;letter-spacing:.12em}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(70,211,160,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,211,160,.55)}70%{box-shadow:0 0 0 8px rgba(70,211,160,0)}100%{box-shadow:0 0 0 0 rgba(70,211,160,0)}}
#clock{color:var(--fg);font-variant-numeric:tabular-nums}

.cases{display:flex;border:1px solid var(--line-2);margin-left:auto}
.case-tab{background:rgba(10,19,34,.9);border:0;border-right:1px solid var(--line-2);padding:6px 16px;min-height:44px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);text-align:left;line-height:1.3;transition:background .2s,color .2s}
.case-tab:last-child{border-right:0}
.case-tab b{display:block;font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.16em;color:var(--dim)}
.case-tab:hover{color:var(--fg)}
.case-tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--amber)}
.case-tab[aria-selected="true"] b{color:var(--amber)}
.top-right{margin-left:0}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;min-height:0}

.viewport{position:relative;min-height:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(14,26,46,.92),rgba(8,15,28,.94));border:1px solid var(--line)}
/* HUD corner brackets: the one ornamental flourish */
.viewport::before,.viewport::after{content:"";position:absolute;width:18px;height:18px;pointer-events:none;z-index:3}
.viewport::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.viewport::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--cyan);border-right:2px solid var(--cyan)}

.scene-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:16px 22px 12px;border-bottom:1px solid var(--line)}
.scene-step{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:var(--cyan)}
.scene-title{margin:2px 0 0;font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.scene-meta{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-align:right}
.scene-body{flex:1;min-height:0;overflow:auto;padding:18px 22px 22px;scrollbar-color:var(--line-2) transparent}

/* transition overlay */
.scan{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,12,23,.86);backdrop-filter:blur(2px)}
.scan[hidden]{display:none!important}
.scan .t1{font-family:var(--f-display);letter-spacing:.4em;font-size:13px;color:var(--cyan)}
.scan .t2{font-size:13px;color:var(--muted)}
.scan .bar{width:min(320px,70%);height:2px;background:var(--line-2);overflow:hidden}
.scan .bar i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.scan.run .bar i{animation:fill .62s ease-out forwards}
.scan .beam{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);box-shadow:0 0 18px 2px rgba(92,208,255,.5);top:0}
.scan.run .beam{animation:beam .62s linear forwards}
@keyframes fill{to{width:100%}}
@keyframes beam{to{top:100%}}

/* ---------- analyst rail ---------- */
.analyst{min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:rgba(10,19,34,.92);border:1px solid var(--line)}
.persona{padding:16px 18px;display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;flex:none;border:1px solid var(--line-2);display:grid;place-items:center;position:relative;background:var(--panel-2)}
.avatar span{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--cyan)}
.who{min-width:0}
.who b{display:block;font-weight:600;font-size:15px}
.who small{color:var(--muted);font-size:12px}
.wave{margin-left:auto;display:flex;gap:3px;align-items:center;height:22px}
.wave i{width:3px;height:4px;background:var(--dim);transition:background .2s}
.speaking .wave i{background:var(--cyan);animation:wv .9s ease-in-out infinite}
.speaking .wave i:nth-child(2){animation-delay:.12s}.speaking .wave i:nth-child(3){animation-delay:.24s}
.speaking .wave i:nth-child(4){animation-delay:.36s}.speaking .wave i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:4px}50%{height:20px}}

.brief{flex:1;min-height:0;display:flex;flex-direction:column}
.brief-head,.log-head{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.brief-head button{background:none;border:0;cursor:pointer;color:var(--cyan);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;padding:2px 0}
.say{flex:1;min-height:0;overflow:auto;padding:16px 18px 18px;font-size:15.5px;line-height:1.78;cursor:pointer}
.say .to{display:block;font-family:var(--f-mono);font-size:11px;color:var(--amber);letter-spacing:.1em;margin-bottom:8px}
.say .hl{color:var(--amber);font-weight:600}
.say .caret{display:inline-block;width:8px;height:1.05em;background:var(--cyan);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.log{max-height:38%;min-height:0;display:flex;flex-direction:column}
.log ol{list-style:none;margin:0;padding:8px 0;overflow:auto}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:7px 18px;font-size:12.5px;animation:inLog .4s ease-out}
.log li .id{font-family:var(--f-mono);color:var(--cyan);font-size:11px;padding-top:1px}
.log li.empty{display:block;color:var(--dim)}
@keyframes inLog{from{background:var(--cyan-soft)}to{background:transparent}}

/* ---------- step nav ---------- */
.steps{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.step-list{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:0}
.step{position:relative;text-align:left;background:rgba(10,19,34,.9);border:1px solid var(--line);padding:9px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0;transition:border-color .2s,background .2s}
.step:hover{border-color:var(--line-2)}
.step .n{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--dim)}
.step .l{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-1px;height:2px;background:transparent}
.step.done .n{color:var(--cyan)}
.step.done .l{color:var(--fg)}
.step.active{background:var(--panel-2);border-color:var(--line-2)}
.step.active .n{color:var(--amber)}
.step.active .l{color:var(--fg)}
.step.active::after{background:var(--amber)}
.ctrl{display:flex;gap:6px}
.btn{background:rgba(10,19,34,.9);border:1px solid var(--line-2);padding:0 16px;min-height:44px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#04121f}
.btn.primary:hover{background:#86ddff}
.btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.35;cursor:default}
.kbd{font-family:var(--f-mono);font-size:10px;color:var(--dim);border:1px solid var(--line-2);padding:0 4px}

/* ---------- shared viz bits ---------- */
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.panel{background:rgba(6,12,23,.55);border:1px solid var(--line);padding:14px 16px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:2px;background:currentColor;display:inline-block}
.chart-scroll{overflow-x:auto;overflow-y:hidden}
.chart-scroll svg{display:block;width:100%;height:auto;min-width:620px}
svg.tl{display:block;width:100%;height:auto}
@media (min-width:981px){ .s1-grid .chart-scroll svg{min-width:0} }
svg text{font-family:var(--f-mono)}
.ax{fill:var(--dim);font-size:11px}
.gridl{stroke:rgba(122,150,200,.10);stroke-width:1}
.draw{animation:draw 1.5s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade-in{animation:fadeIn .6s ease-out both}
@keyframes fadeIn{from{opacity:.0}to{opacity:1}}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:14px}
.kpi{background:var(--panel);padding:12px 16px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi .v small{font-size:15px;margin-left:2px;color:var(--muted);font-weight:500}
.kpi.warn .v{color:var(--amber)}
.kpi.crit .v{color:var(--red)}

.s1-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.building{position:relative;height:100%;min-height:300px}
.building canvas{position:absolute;inset:0;width:100%;height:100%}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--green);background:var(--green-soft)}
.chip.warn{color:var(--amber);background:var(--amber-soft)}
.chip.crit{color:var(--red);background:var(--red-soft)}
.chip.mute{color:var(--muted)}

.phase-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.phase{padding:12px 14px;border:1px solid var(--line);border-top:2px solid var(--c,var(--cyan));background:rgba(6,12,23,.55);min-width:0}
.phase b{display:block;font-size:14px;margin:2px 0 2px}
.phase .num{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--c,var(--cyan));font-variant-numeric:tabular-nums}
.phase p{margin:2px 0 0;color:var(--muted);font-size:12.5px}

/* suspects */
.suspects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sus{position:relative;border:1px solid var(--line);background:rgba(6,12,23,.55);padding:14px 16px 14px;overflow:hidden;transition:border-color .3s, background .3s;min-width:0}
.sus .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:var(--dim)}
.sus h3{margin:2px 0 10px;font-size:17px;font-weight:600}
.sus .row{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:5px}
.sus .row span:last-child{text-align:right;font-family:var(--f-mono);color:var(--fg);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .7s cubic-bezier(.3,0,.2,1)}
.track.p i{background:var(--dim)}
.track.a i{background:var(--cyan)}
.sus .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-2)}
.sus .contrib{font-family:var(--f-display);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.sus .contrib small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.sus .note{font-size:12px;color:var(--muted);margin-top:6px;min-height:1.5em}
.sus .verdict{opacity:0;transition:opacity .3s}
.sus.revealed .verdict{opacity:1}
.sus.scanning{border-color:var(--cyan);background:rgba(92,208,255,.05)}
.sus.scanning::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,rgba(92,208,255,.16),transparent);animation:susScan .5s linear}
@keyframes susScan{to{top:100%}}
.sus.culprit{border-color:var(--red);background:linear-gradient(180deg,rgba(255,93,99,.09),rgba(6,12,23,.55))}
.sus.culprit .contrib{color:var(--red)}
.stack{display:flex;height:30px;margin-top:14px;border:1px solid var(--line);overflow:hidden}
.stack div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;color:#04121f;transition:flex-grow .9s cubic-bezier(.3,0,.2,1)}

/* evidence */
.ev-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.ev{border:1px solid var(--line);padding:12px 14px;background:rgba(6,12,23,.55);min-width:0}
.ev .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ev .r{font-family:var(--f-display);font-weight:600;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.ev p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ev.key{border-color:var(--red);background:linear-gradient(180deg,rgba(255,93,99,.08),rgba(6,12,23,.55))}
.ev.key .r{color:var(--red)}
.chart-wrap{position:relative}
.tip{position:absolute;pointer-events:none;background:#0b1730;border:1px solid var(--line-2);padding:8px 10px;font-size:12px;min-width:150px;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tip b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--cyan);margin-bottom:4px;letter-spacing:.06em}
.tip div{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip div span:first-child{color:var(--muted)}
.loss{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.loss b{color:var(--fg);font-family:var(--f-mono);font-weight:500}

/* simulator */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px}
.ctl{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ctl:first-of-type{padding-top:4px}
.ctl-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ctl-head b{font-size:14px;font-weight:600}
.ctl-head span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.ctl p{margin:0;font-size:12.5px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:9px 0;cursor:pointer;font-family:var(--f-mono);font-size:13px;border-right:1px solid var(--line-2);color:var(--muted);transition:background .2s,color .2s}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--cyan);color:#04121f;font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--cyan);outline-offset:-2px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg .sl{width:42px;height:24px;flex:none;border:1px solid var(--line-2);position:relative;transition:background .2s,border-color .2s}
.tg .sl::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;background:var(--muted);transition:transform .2s,background .2s}
.tg input:checked+.sl{background:var(--cyan-soft);border-color:var(--cyan)}
.tg input:checked+.sl::after{transform:translateX(18px);background:var(--cyan)}
.tg input:focus-visible+.sl{outline:2px solid var(--cyan);outline-offset:2px}
.sim-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.result{display:flex;flex-direction:column;gap:12px}
.fc{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fc .date{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ledger{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--line)}
.ledger div{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ledger div:nth-child(odd){color:var(--muted)}
.ledger div:nth-child(even){text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ledger .tot{color:var(--fg)!important;font-weight:600}
.ledger .save{color:var(--green)}
.hint{font-size:12.5px;color:var(--muted);border-left:2px solid var(--amber);padding:4px 0 4px 10px}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .stage{grid-template-columns:minmax(0,1fr) 320px}
  .suspects{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  html,body{height:auto}
  .app{height:auto}
  .stage{grid-template-columns:minmax(0,1fr)}
  .analyst{order:-1}
  .say{max-height:none;min-height:120px}
  .log{max-height:220px}
  .s1-grid,.sim{grid-template-columns:minmax(0,1fr)}
  .building{min-height:300px}
  .case{border-left:0;padding-left:0}
  .top-right{margin-left:0}
}
@media (max-width:640px){

<script>
(() => {
"use strict";
const NS = "http://www.w3.org/2000/svg";
const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

/* ======================== CASE DATA (fictional sample) ======================== */
const START = new Date(2026, 5, 22);          // 착공 2026-06-22 (월)
const TOTAL_W = 40, NOW_W = 21;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const weekStart = n => addDays(START, (n - 1) * 7);
const weekEnd = n => addDays(START, n * 7 - 1);
const DOW = ["일","월","화","수","목","금","토"];
const md = d => `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, "0")}`;

const sig = w => 1 / (1 + Math.exp(-(w - 20) / 5.2));
const plan = w => (sig(w) - sig(0)) / (sig(TOTAL_W) - sig(0)) * 100;
// 주간 SPI (계획 대비 실적 진척 비율), W1..W21
const SPI = [1.02,0.98,1.03,1.00,0.97,1.01,1.04,0.99,1.00,0.98,1.02,1.01,0.99,0.32,0.12,0.38,0.72,0.84,0.95,0.96,0.94];
const actual = [0];
for (let w = 1; w <= NOW_W; w++) actual[w] = actual[w - 1] + (plan(w) - plan(w - 1)) * SPI[w - 1];

const P_NOW = plan(NOW_W), A_NOW = actual[NOW_W], GAP = P_NOW - A_NOW;
// 실적이 계획 곡선상 어느 시점에 해당하는지 (이분법)

for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (plan(m) < A_NOW) lo = m; else hi = m; }
const W_EQ = (lo + hi) / 2;
const DELAY = Math.round((NOW_W - W_EQ) * 7);
const BASE_DATE = weekEnd(NOW_W);              // 2026-11-15
const CONTRACT_END = weekEnd(TOTAL_W);         // 계약 준공일

const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
const SPI_NORMAL = avg(SPI.slice(0, 13)), SPI_DROP = avg(SPI.slice(13, 18)), SPI_REC = avg(SPI.slice(18, 21));

// 공종별 (21주차 기준 계획/실적 %, 지연 기여도 %)
const TRADES = [
  { code:"S-01", name:"토공 · 기초", p:100, a:100, c:0,  v:["ok","알리바이 확인"], note:"9주차에 계획대로 완료" },
  { code:"S-02", name:"골조 (RC)",   p:72,  a:41,  c:58, v:["crit","주범"],        note:"14주차부터 진척 급감" },
  { code:"S-03", name:"철골",        p:38,  a:19,  c:17, v:["warn","연쇄 피해"],   note:"선행 골조 대기로 착수 지연" },
  { code:"S-04", name:"기계설비",    p:30,  a:21,  c:11, v:["warn","연쇄 피해"],   note:"슬리브 · 매립배관 대기" },

  { code:"S-06", name:"외장 · 마감", p:8,   a:2,   c:7,  v:["mute","영향 경미"],   note:"착수 초기 단계" }
];

// 일별 증거 (13~17주차, 35일)
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261115);
const D0 = weekStart(13);
const RAIN = { "9.17":4, "9.22":38, "9.23":72, "9.24":26, "10.03":6 };
const DAYS = [];
for (let i = 0; i < 35; i++) {
  const d = addDays(D0, i), sun = d.getDay() === 0, key = md(d);
  const rain = RAIN[key] || 0;
  let rem, lab;
  if (i <= 7)        { rem = 172 + R() * 28;                     lab = 80 + R() * 8; }
  else if (i <= 10)  { rem = [26, 0, 0][i - 8];                  lab = [41, 22, 34][i - 8]; }
  else if (i <= 23)  { rem = R() < 0.35 ? 0 : R() * 13;          lab = 70 - (i - 11) * 2.5 + R() * 4; }
  else               { rem = Math.min(195, 118 + (i - 24) * 6.5 + R() * 14); lab = 44 + (i - 24) * 2.6 + R() * 4; }
  if (sun) { rem = 0; lab = 0; }
  const rainF = rain > 20 ? 0.12 : rain > 5 ? 0.85 : 1;
  const remF = Math.min(1, rem / 185), labF = Math.min(1, lab / 85);
  const inspect = i === 4 ? 0.55 : 1;   // 9.18 타설 전 검측 지연
  const prog = sun ? 0 : Math.max(0, Math.min(100, Math.min(remF, labF) * rainF * inspect * 100 * (0.86 + R() * 0.16) + (R() - 0.5) * 14));
  let cause = null;
  if (!sun) cause = rain > 20 ? "rain" : (remF < labF ? "rem" : "lab");
  DAYS.push({ d, sun, rain, rem: Math.round(rem), lab: Math.round(lab), prog, cause });
}
function pearson(xs, ys){
  const mx = avg(xs), my = avg(ys); let n = 0, a = 0, b = 0;
  for (let i = 0; i < xs.length; i++){ const dx = xs[i] - mx, dy = ys[i] - my; n += dx * dy; a += dx * dx; b += dy * dy; }
  return n / Math.sqrt(a * b);
}
const WD = DAYS.filter(x => !x.sun);
const R_RAIN = pearson(WD.map(x => x.rain), WD.map(x => x.prog));
const R_REM  = pearson(WD.map(x => x.rem),  WD.map(x => x.prog));
const R_LAB  = pearson(WD.map(x => x.lab),  WD.map(x => x.prog));
const LOSS = { rain:0, rem:0, lab:0 };
WD.forEach(x => { LOSS[x.cause] += Math.max(0, 1 - x.prog / 100); });
const fmtR = r => (r < 0 ? "−" : "") + Math.abs(r).toFixed(2);

// 만회 시뮬레이션 모델
const PENALTY_PER_DAY = 2430;  // 만 원/일 : 486억 × 지체상금률 0.5/1,000
const COST = { crew: 4200, sunday: 5600, deck: 11000 };  // 만 원
function simulate(crews, sunday, deck){
  const p = 0.95 + 0.045 * crews + (sunday ? 0.09 : 0) + (deck ? 0.06 : 0);
  const remainDays = (TOTAL_W - W_EQ) * 7;
  const finish = addDays(BASE_DATE, Math.ceil(remainDays / p));
  const delay = dayDiff(CONTRACT_END, finish);
  const cost = crews * COST.crew + (sunday ? COST.sunday : 0) + (deck ? COST.deck : 0);
  const penalty = Math.max(0, delay) * PENALTY_PER_DAY;
  return { p, finish, delay, cost, penalty, total: cost + penalty };
}
const BASE = simulate(0, false, false);
const won = v => {
  if (Math.abs(v) >= 10000) return (v / 10000).toFixed(2).replace(/\.?0+$/, "") + "억 원";
  return v.toLocaleString("ko-KR") + "만 원";

/* ======================== SVG helpers ======================== */
function el(tag, attrs, parent){

}
function tx(parent, x, y, str, attrs){ const t = el("text", Object.assign({ x, y }, attrs || {}), parent); t.textContent = str; return t; }

}
const pts = arr => arr.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");

/* ======================== SCENES ======================== */
let cleanup = null;
const body = $("sceneBody");

function sceneOverview(){
  body.innerHTML = `
    <div class="kpis">

    </div>
    <div class="s1-grid">
      <div class="panel">
        <div class="panel-head"><span class="eyebrow">누적 공정률 S-curve</span>
          <div class="legend"><span style="color:var(--muted)"><i class="sw" style="background:none;border-top:2px dashed var(--muted)"></i>계획</span><span style="color:var(--cyan)"><i class="sw"></i>실적</span><span style="color:var(--amber)"><i class="sw" style="height:8px;opacity:.5"></i>격차 구간</span></div>
        </div>
        <div class="chart-scroll"><svg id="sc1" viewBox="0 0 640 360" role="img" aria-label="계획 대비 실적 누적 공정률 곡선"></svg></div>
      </div>

  const svg = $("sc1"), W = 640, H = 360, L = 46, Rr = 22, T = 22, B = 36;
  const xs = w => L + w / TOTAL_W * (W - L - Rr), ys = v => T + (1 - v / 100) * (H - T - B);
  for (let v = 0; v <= 100; v += 25){ el("line", { x1:L, x2:W - Rr, y1:ys(v), y2:ys(v), class:"gridl" }, svg); tx(svg, L - 8, ys(v) + 4, v + "%", { class:"ax", "text-anchor":"end" }); }
  for (let w = 0; w <= TOTAL_W; w += 5){ tx(svg, xs(w), H - B + 18, "W" + w, { class:"ax", "text-anchor":"middle" }); el("line", { x1:xs(w), x2:xs(w), y1:H - B, y2:H - B + 5, stroke:"#26395c" }, svg); }
  // gap zone
  const zone = [];
  for (let w = 13; w <= NOW_W; w += 0.5) zone.push([xs(w), ys(plan(w))]);
  for (let w = NOW_W; w >= 13; w--) zone.push([xs(w), ys(actual[w])]);
  el("path", { d: pts(zone) + "Z", fill:"rgba(255,179,64,.16)", class:"fade-in", style:"animation-delay:1.1s" }, svg);
  // plan
  const pp1 = [], pp2 = [];
  for (let w = 0; w <= NOW_W; w += 0.5) pp1.push([xs(w), ys(plan(w))]);
  for (let w = NOW_W; w <= TOTAL_W; w += 0.5) pp2.push([xs(w), ys(plan(w))]);
  el("path", { d: pts(pp2), fill:"none", stroke:"#4a5b7a", "stroke-width":1.5, "stroke-dasharray":"3 5" }, svg);
  const planP = el("path", { d: pts(pp1), fill:"none", stroke:"#9fb0cc", "stroke-width":1.8, "stroke-dasharray":"6 5" }, svg);

  const actP = el("path", { d: pts(ap), fill:"none", stroke:"#5cd0ff", "stroke-width":2.4, "stroke-linejoin":"round" }, svg);
  drawIn(actP, 0.1);
  // today line
  el("line", { x1:xs(NOW_W), x2:xs(NOW_W), y1:T - 6, y2:H - B, stroke:"#5cd0ff", "stroke-opacity":.45, "stroke-dasharray":"2 4" }, svg);
  tx(svg, xs(NOW_W) + 6, T + 4, "기준 " + md(BASE_DATE), { class:"ax", fill:"#5cd0ff" });
  // annotations
  const g = el("g", { class:"fade-in", style:"animation-delay:1.3s" }, svg);
  const yA = ys(A_NOW), yP = ys(P_NOW), xE = xs(W_EQ), xN = xs(NOW_W);
  el("line", { x1:xE, x2:xN, y1:yA, y2:yA, stroke:"#ffb340", "stroke-width":1.5 }, g);
  el("path", { d:`M${xE + 7} ${yA - 4} L${xE} ${yA} L${xE + 7} ${yA + 4}`, fill:"none", stroke:"#ffb340", "stroke-width":1.5 }, g);
  el("circle", { cx:xE, cy:yA, r:3, fill:"#ffb340" }, g);
  tx(g, (xE + xN) / 2, yA + 18, `${DELAY}일 지연`, { fill:"#ffb340", "font-size":12, "text-anchor":"middle", "font-weight":600 });
  el("line", { x1:xN + 10, x2:xN + 10, y1:yP, y2:yA, stroke:"#ffb340", "stroke-width":1.5 }, g);
  el("line", { x1:xN + 6, x2:xN + 14, y1:yP, y2:yP, stroke:"#ffb340", "stroke-width":1.5 }, g);
  el("line", { x1:xN + 6, x2:xN + 14, y1:yA, y2:yA, stroke:"#ffb340", "stroke-width":1.5 }, g);
  tx(g, xN + 20, (yP + yA) / 2 + 4, `−${GAP.toFixed(1)}%p`, { fill:"#ffb340", "font-size":12, "font-weight":600 });
  el("circle", { cx:xN, cy:yA, r:4.5, fill:"#060c17", stroke:"#5cd0ff", "stroke-width":2 }, g);
  el("circle", { cx:xN, cy:yP, r:3.5, fill:"#9fb0cc" }, g);
  tx(g, xs(13), ys(plan(13)) - 12, "W13 이후 이탈", { class:"ax", fill:"#7d8fae", "text-anchor":"end" });

function buildingCanvas(cv){
  const ctx = cv.getContext("2d");
  const LV = ["B1","1F","2F","3F","4F","5F","6F"];
  // 실적: B1~2F 완료, 3F 40%   / 계획: B1~4F 완료, 5F 60%
  const ACT = [1,1,1,0.4,0,0,0], PLN = [1,1,1,1,1,0.6,0];
  const FX = 64, FY = 38, FH = 11;
  const c30 = Math.cos(Math.PI / 6), s30 = 0.5;
  let raf = 0, t0 = performance.now(), alive = true, dims = null;
  const proj = (x, y, z) => [(x - y) * c30, (x + y) * s30 - z];

  function fit(){
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!r.width || !r.height) return false;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const corners = [proj(0,0,0), proj(FX,0,0), proj(0,FY,0), proj(FX,FY,0), proj(0,0,FH*7), proj(FX,0,FH*7), proj(0,FY,FH*7)];
    const minX = Math.min(...corners.map(c => c[0])), maxX = Math.max(...corners.map(c => c[0]));
    const minY = Math.min(...corners.map(c => c[1])), maxY = Math.max(...corners.map(c => c[1]));
    const padR = 118;
    const sc = Math.min((r.width - 24 - padR) / (maxX - minX), (r.height - 30) / (maxY - minY));
    dims = { w:r.width, h:r.height, dpr, sc, ox:12 - minX * sc + ((r.width - 24 - padR) - (maxX - minX) * sc) / 2, oy:15 - minY * sc + ((r.height - 30) - (maxY - minY) * sc) / 2 };
    return true;
  }
  const P = (x, y, z) => { const p = proj(x, y, z); return [dims.ox + p[0] * dims.sc, dims.oy + p[1] * dims.sc]; };

    ctx.beginPath(); points.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    if (stroke){ ctx.setLineDash(dash || []); ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); ctx.setLineDash([]); }

    const x0 = 0, y0 = 0, y1 = FY, zt = z0 + dz;
    const top = [P(x0,y0,zt), P(x1,y0,zt), P(x1,y1,zt), P(x0,y1,zt)];
    const right = [P(x1,y0,z0), P(x1,y1,z0), P(x1,y1,zt), P(x1,y0,zt)];
    const left = [P(x0,y1,z0), P(x1,y1,z0), P(x1,y1,zt), P(x0,y1,zt)];
    if (style === "act"){
      poly(left, "rgba(92,208,255,.20)", "rgba(92,208,255,.9)");
      poly(right, "rgba(92,208,255,.11)", "rgba(92,208,255,.9)");
      poly(top, "rgba(92,208,255,.30)", "rgba(150,225,255,1)");
    } else if (style === "plan"){
      poly(left, "rgba(255,179,64,.04)", "rgba(255,179,64,.85)", [4,4]);
      poly(right, "rgba(255,179,64,.02)", "rgba(255,179,64,.85)", [4,4]);
      poly(top, null, "rgba(255,179,64,.85)", [4,4]);
    } else {
      poly(left, null, "rgba(122,150,200,.16)", [2,4]);
      poly(right, null, "rgba(122,150,200,.16)", [2,4]);
      poly(top, null, "rgba(122,150,200,.16)", [2,4]);
    }
  }
  function frame(now){
    if (!alive) return;
    if (!dims && !fit()){ raf = requestAnimationFrame(frame); return; }
    const t = reduced ? 99 : (now - t0) / 1000;
    ctx.setTransform(dims.dpr, 0, 0, dims.dpr, 0, 0);
    ctx.clearRect(0, 0, dims.w, dims.h);
    // ground grid
    for (let gx = -16; gx <= FX + 16; gx += 8){ ctx.beginPath(); const a = P(gx,-16,0), b = P(gx,FY+16,0); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.strokeStyle = "rgba(92,208,255,.06)"; ctx.lineWidth = 1; ctx.stroke(); }
    for (let gy = -16; gy <= FY + 16; gy += 8){ ctx.beginPath(); const a = P(-16,gy,0), b = P(FX+16,gy,0); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.strokeStyle = "rgba(92,208,255,.06)"; ctx.stroke(); }
    // levels
    ctx.font = "500 11px 'IBM Plex Mono', monospace";
    for (let i = 0; i < LV.length; i++){
      const appear = Math.max(0, Math.min(1, (t - i * 0.16) / 0.35));
      const z0 = i * FH;
      box(FX, z0, FH, "ghost");
      if (PLN[i] > ACT[i] && appear > 0) box(FX * PLN[i], z0, FH * (0.92), "plan");
      if (ACT[i] > 0 && appear > 0) box(FX * ACT[i], z0, FH * 0.92 * appear, "act");
      // label on right
      const lp = P(FX, 0, z0 + FH * 0.55);
      const st = ACT[i] >= 1 ? ["완료", "#5cd0ff"] : ACT[i] > 0 ? [Math.round(ACT[i] * 100) + "% / 계획 " + Math.round(PLN[i] * 100), "#ffb340"] : PLN[i] > 0 ? ["0% / 계획 " + Math.round(PLN[i] * 100), "#ffb340"] : ["예정", "#4a5b7a"];
      ctx.fillStyle = "#7d8fae"; ctx.fillText(LV[i], lp[0] + 10, lp[1] + 4);
      ctx.fillStyle = st[1]; ctx.fillText(st[0], lp[0] + 34, lp[1] + 4);
    }
    // scanning plane
    if (!reduced){
      const sz = ((Math.sin(t * 0.9) + 1) / 2) * FH * 7;
      poly([P(-4,-4,sz), P(FX+4,-4,sz), P(FX+4,FY+4,sz), P(-4,FY+4,sz)], "rgba(92,208,255,.05)", "rgba(92,208,255,.35)");
    }
    if (!reduced) raf = requestAnimationFrame(frame);
  }
  const ro = new ResizeObserver(() => { dims = null; if (reduced) { if (fit()) frame(performance.now()); } });
  ro.observe(cv);
  raf = requestAnimationFrame(frame);
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); };
}

  const lb = el("g", null, lock);
  el("rect", { x:lx, y:ly - 22, width:236, height:20, fill:"#ff5d63" }, lb);
  tx(lb, lx + 8, ly - 8, `최초 이탈 W14 · ${md(weekStart(14))}–${md(weekEnd(14))} · SPI ${SPI[13].toFixed(2)}`, { "font-size":11, fill:"#1a0406", "font-weight":600 });
  let raf = 0, alive = true;
  const showLock = () => { lock.setAttribute("opacity", 1); beamG.setAttribute("transform", `translate(${target},0)`); beamG.setAttribute("opacity", .5); };
  if (reduced){ showLock(); }
  else {
    const t0 = performance.now(), dur = 1500, x0 = L, x1 = W - Rr;
    const step = now => {
      if (!alive) return;
      const k = Math.min(1, (now - t0) / dur);
      let x;
      if (k < 0.62) x = x0 + (x1 - x0) * (k / 0.62);
      else { const e = (k - 0.62) / 0.38; const ee = 1 - Math.pow(1 - e, 3); x = x1 + (target - x1) * ee; }
      beamG.setAttribute("transform", `translate(${x},0)`);
      if (k < 1) raf = requestAnimationFrame(step); else showLock();
    };
    raf = requestAnimationFrame(step);
  }
  return () => { alive = false; cancelAnimationFrame(raf); };
}

    const wr = wrap.getBoundingClientRect();
    const sx = ctm.a * cx + ctm.e - wr.left;
    const tw = tip.offsetWidth;
    tip.style.left = (sx + 14 + tw > wr.width ? sx - 14 - tw : sx + 14) + "px";
    tip.style.top = Math.max(4, Math.min(wr.height - tip.offsetHeight - 4, e.clientY - wr.top - 40)) + "px";
  };
  const leave = () => { tip.hidden = true; cross.setAttribute("stroke-opacity", 0); };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
  return null;
}

  el("line", { x1:LL, x2:W - Rr, y1:yl(LOSS_PLAN), y2:yl(LOSS_PLAN), stroke:"#46d3a0", "stroke-dasharray":"4 4" }, s);
  tx(s, W - Rr + 4, yl(LOSS_PLAN) + 4, "계획 3%", { class:"ax", fill:"#46d3a0", "font-size":10 });
  const lp = RB_L.map((v, i) => [LL + i * bw + bw / 2, yl(v)]);
  const lpath = el("path", { d:pts(lp), fill:"none", stroke:"#ff5d63", "stroke-width":2.2, "stroke-linejoin":"round" }, s);
  lp.forEach((p, i) => { el("circle", { cx:p[0], cy:p[1], r:2.6, fill:"#ff5d63" }, s); if (RB_L[i] > 20) tx(s, p[0], p[1] - 8, RB_L[i].toFixed(1), { "text-anchor":"middle", "font-size":10.5, fill:"#ff5d63" }); });
  drawIn(lpath, 0.3);
  return null;
}

/* ======================== CONTROLLER ======================== */
const CASES = {
  schedule: { no:"SFL-26-1115-A", sub:"공정 지연 수사", scenes:SCENES },
  cost:     { no:"SFL-26-1115-B", sub:"원가 초과 수사", scenes:SCENES_B }
};
let caseId = "schedule", SC = SCENES;
let cur = -1, typing = null, autoTimer = null, auto = false, busy = false;
const visitedBy = { schedule:new Set(), cost:new Set() };
const stepList = $("stepList");
function buildSteps(){
  stepList.innerHTML = SC.map((s, i) => `<button class="step" type="button" data-i="${i}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="l">${s.label}</span></button>`).join("");
}
stepList.addEventListener("click", e => { const b = e.target.closest(".step"); if (b) go(+b.dataset.i); });

function speak(text){
  const say = $("say"), persona = $("persona");
  if (typing) typing.stop();
  say.innerHTML = `<span class="to">TO. 현장소장</span>`;
  const segs = text.split(/(\[\[.*?\]\])/).filter(Boolean).map(s => s.startsWith("[[") ? { hl:true, t:s.slice(2, -2) } : { hl:false, t:s });
  const nodes = segs.map(s => { const sp = document.createElement("span"); if (s.hl) sp.className = "hl"; say.appendChild(sp); return sp; });
  const caret = document.createElement("span"); caret.className = "caret"; say.appendChild(caret);
  let si = 0, ci = 0, tm = 0, done = false;
  const finish = () => {
    if (done) return; done = true; clearTimeout(tm);
    segs.forEach((s, i) => { nodes[i].textContent = s.t; });
    persona.classList.remove("speaking");
    scheduleAuto();
  };
  const tick = () => {
    if (done) return;
    if (si >= segs.length) { finish(); return; }
    const seg = segs[si];
    ci++;
    nodes[si].textContent = seg.t.slice(0, ci);
    const ch = seg.t[ci - 1];
    if (ci >= seg.t.length) { si++; ci = 0; }
    tm = setTimeout(tick, /[.,?!]/.test(ch) ? 170 : 26);
  };
  if (reduced) { finish(); }
  else { persona.classList.add("speaking"); tm = setTimeout(tick, 200); }
  typing = { stop(){ done = true; clearTimeout(tm); persona.classList.remove("speaking"); }, finish };
}

function renderLog(focus){
  const visited = visitedBy[caseId], ol = $("log");
  const items = [...visited].sort((a, b) => a - b);
  ol.innerHTML = items.length ? items.map(k => `<li${k === focus ? "" : ' style="animation:none"'}><span class="id">E-${String(k + 1).padStart(2, "0")}</span><span>${SC[k].log}</span></li>`).join("") : `<li class="empty">수집된 증거가 없습니다.</li>`;
  $("logCount").textContent = `${visited.size} / ${SC.length}`;
  const li = ol.children[items.indexOf(focus)]; if (li) li.scrollIntoView({ block:"nearest" });
}

function render(i){
  if (cleanup) { try { cleanup(); } catch (e) {} cleanup = null; }
  const s = SC[i];
  $("sceneStep").textContent = `STEP ${String(i + 1).padStart(2, "0")} / ${String(SC.length).padStart(2, "0")}`;
  $("sceneTitle").textContent = s.title;
  $("sceneMeta").textContent = s.meta;
  body.scrollTop = 0;
  cleanup = s.render() || null;
  speak(s.say);
  const fresh = !visitedBy[caseId].has(i);
  visitedBy[caseId].add(i);
  renderLog(fresh ? i : -1);
}

function go(i, force){
  if (i < 0 || i >= SC.length || busy) return;
  if (i === cur && !force) return;
  clearTimeout(autoTimer);
  const first = cur === -1 && !force;
  cur = i;
  const visited = visitedBy[caseId];
  [...stepList.children].forEach((b, k) => { b.classList.toggle("active", k === i); b.classList.toggle("done", visited.has(k) || k < i); b.setAttribute("aria-current", k === i ? "step" : "false"); });
  $("prevBtn").disabled = i === 0;
  $("nextBtn").disabled = i === SC.length - 1;
  $("nextBtn").textContent = i === SC.length - 1 ? "브리핑 완료" : "다음 증거 →";
  if (first || reduced) { render(i); return; }
  const scan = $("scan");
  $("scanLabel").textContent = SC[i].scan;
  scan.hidden = false; scan.classList.remove("run"); void scan.offsetWidth; scan.classList.add("run");
  busy = true;
  setTimeout(() => { scan.hidden = true; scan.classList.remove("run"); busy = false; render(i); }, 650);
}

function setCase(id, initial){
  if (!CASES[id] || (id === caseId && !initial) || busy) return;
  setAuto(false);
  caseId = id; SC = CASES[id].scenes;
  document.querySelectorAll(".case-tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.case === id)));
  $("caseNo").textContent = CASES[id].no;
  $("brandSub").textContent = "현장 포렌식 랩 · " + CASES[id].sub;
  buildSteps();
  renderLog(-1);
  cur = -1;
  go(0, !initial);
}
document.querySelectorAll(".case-tab").forEach(t => t.addEventListener("click", () => {
  if (t.dataset.case === caseId || busy) return;
  try { history.replaceState(null, "", "#" + t.dataset.case); } catch (e) {}
  setCase(t.dataset.case);
}));
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (CASES[h] && h !== caseId) setCase(h); });

function scheduleAuto(){
  clearTimeout(autoTimer);
  if (!auto) return;
  if (cur >= SC.length - 1) { setAuto(false); return; }
  autoTimer = setTimeout(() => go(cur + 1), 4200);
}
function setAuto(v){
  auto = v; $("autoBtn").setAttribute("aria-pressed", String(v));
  $("autoBtn").textContent = v ? "자동 브리핑 중지" : "자동 브리핑";
  if (v) { if (cur >= SC.length - 1) go(0); else if (!$("persona").classList.contains("speaking")) scheduleAuto(); }
  else clearTimeout(autoTimer);
}

$("prevBtn").addEventListener("click", () => go(cur - 1));
$("nextBtn").addEventListener("click", () => go(cur + 1));
$("autoBtn").addEventListener("click", () => setAuto(!auto));
$("say").addEventListener("click", () => typing && typing.finish());
$("skipBtn").addEventListener("click", () => typing && typing.finish());
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea, select")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});

const clock = $("clock");
const tickClock = () => { const d = new Date(); clock.textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, "0")).join(":"); };
tickClock(); setInterval(tickClock, 1000);

setCase(CASES[location.hash.slice(1)] ? location.hash.slice(1) : "schedule", true);
})();
